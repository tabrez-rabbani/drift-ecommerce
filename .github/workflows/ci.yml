name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1. Backend Service Validation
  backend:
    name: Backend Lint & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax & Module check
        run: |
          node --check server.js
          node --check src/app.js
          node --check src/config/config.js

      - name: Security audit (dependencies)
        run: npm audit --audit-level=critical

  # 2. Storefront (Frontend) Build Check
  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://drift-api.tabrezrabbani.in/api

  # 3. Admin Panel Build Check
  admin:
    name: Admin Panel Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://drift-api.tabrezrabbani.in/api
          VITE_STOREFRONT_URL: https://drift.tabrezrabbani.in

  # 4. Docker Compose Validation
  docker-validation:
    name: Docker Configuration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment for validation
        run: cp backend/.env.example backend/.env

      - name: Validate docker-compose.yml
        run: docker compose config

